<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่ม App ไว้หน้าจอ</title>

    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Blebets">
    <meta name="theme-color" content="#000000">

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: #1f2833;
            border: 1px solid #c5a059;
            border-radius: 16px;
            padding: 30px 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.25);
        }
        h2 { color: #c5a059; margin-top: 0; font-size: 22px; }
        p { color: #c5c6c7; font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
        
        .btn-install {
            background: linear-gradient(135deg, #d4af37, #c5a059);
            color: #000000;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
            display: block;
        }
        .btn-install:active { transform: scale(0.98); }

        .instruction-box {
            display: none;
            background: #0b0c10;
            border: 1px dashed #c5a059;
            padding: 15px;
            text-align: left;
            margin-top: 15px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.6;
        }
        .instruction-box span { color: #c5a059; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📌 เพิ่ม App ไว้หน้าจอ</h2>
    <p>กรุณาเพิ่มไอคอนลงหน้าจอมือถือเพื่อเข้าใช้งาน</p>

    <button id="installBtn" class="btn-install">📲 กดเพิ่ม App ไว้หน้าจอ</button>

    <div id="iosBox" class="instruction-box">
        <strong>📲 วิธีเพิ่ม App สำหรับ iPhone:</strong><br>
        1. กดปุ่ม <span>แชร์</span> ด้านล่าง (รูปสี่เหลี่ยมลูกศรชี้ขึ้น ⬆️)<br>
        2. เลื่อนลงมาเลือก <span>"เพิ่มไปยังหน้าจอโฮม"</span><br>
        3. กด <span>"เพิ่ม"</span> มุมขวาบน
    </div>
</div>

<script>
    const targetUrl = "https://www.blebets.net/site/home";
    let deferredPrompt;

    const installBtn = document.getElementById('installBtn');
    const iosBox = document.getElementById('iosBox');

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isLINE = /Line/i.test(ua);
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    // 1. ลงทะเบียน Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // 2. ถ้าเปิดผ่านไอคอนหน้าจอโฮมแล้ว ให้ไปหน้าหลักทันที
    if (isStandalone) {
        window.location.href = targetUrl;
    }

    // 3. ถ้าเปิดใน LINE บน Android สั่งเปิดด้วย Chrome อัตโนมัติ
    if (isLINE && !isIOS && !isStandalone) {
        const currentUrl = window.location.href;
        window.location.href = "intent://" + currentUrl.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end";
    }

    // 4. ดักจับปุ่มติดตั้งสำหรับ Android
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });

    if (isIOS && !isStandalone) {
        iosBox.style.display = 'block';
    }

    // 5. เมื่อกดปุ่ม เรียกหน้าต่างติดตั้งระบบขึ้นทันที (ไม่มี Alert)
    installBtn.addEventListener('click', () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
                if (choice.outcome === 'accepted') {
                    window.location.href = targetUrl;
                }
                deferredPrompt = null;
            });
        }
    });
</script>

</body>
</html>
